# Default values for cnpg-postgres.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
clustermode:
  enabled: true

replicaCount: 3
# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/cloudnative-pg/postgresql
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "13.6"
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

superuser:
  enabled: true
  secretName: postgres-superuser-secret
  password: mystrongpassword
#for applying more config tuning refer https://cloudnative-pg.io/docs/1.29/postgresql_conf
postgresql:
  parameters:
    shared_buffers: "2GB"
    max_connections: "500"
    work_mem: "16MB"
    maintenance_work_mem: "512MB"

storage:
  #Mention the size and storageClass for the postgres storage
  size: 1Gi
  storageclass: standard
  accessmode: ReadWriteOnce
  VolumeMode: Filesystem
  WalStorage:
    enabled: false
    size: 1Gi
  # only if the underlying pvc storageClass supports onlineVolumeExpansion otherwise set to False
  resize: False

backup:
  enabled: false
  destinationPath: s3://postgres-backups/prod
  endpointURL: https://minio.example.com
  schedule: "0 2 * * *"
  credentials:
    secretName: minio-backup-secret
    key: minio
    secretkey: minio123
  wal:
    compression: gzip
    maxParallel: 8
  data:
    compression: gzip
  retentionPolicy: "30d"

monitoring:
  enabled: false

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
resources:
  requests:
    memory: "3Gi"
    cpu: "50m"
  limits:
    memory: "4Gi"
    cpu: "100m"

nodeSelector: {}
tolerations: []

affinity:
  enabled: "true"
  podAntiAffinity:
    enabled: "false"
    type: "required"
  topologyKey: kubernetes.io/hostname